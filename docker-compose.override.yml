services:
  caddy:
    image: caddy:2-alpine
    container_name: pedidos-almuerzo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Sin esto, supavisor no puede subir su ulimit de open files y crashea en
  # loop ("cannot modify limit: Operation not permitted").
  supavisor:
    ulimits:
      nofile:
        soft: 100000
        hard: 100000

volumes:
  caddy_data:
  caddy_config:
